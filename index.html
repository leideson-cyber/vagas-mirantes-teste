<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vagas Mirantes</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #F6F5F7;
            --bg-sidebar: #F6F5F7;
            --primary-blue: #0088cc;
            --text-main: #07040D;
            --text-muted: #57535D;
            --border-color: #D7D6D9;
            --card-bg: #FFFFFF;
        }

        * { box-sizing: border-box; font-family: 'Nunito Sans', sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-body); display: flex; height: 100vh; overflow: hidden; color: var(--text-main); position: relative; }
        
        #tela_carregamento { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #FFFFFF; z-index: 9999; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding-bottom: 80px;
        }
        
        .loading-logo-wrapper { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .loading-aura {
            position: absolute; width: 200px; height: 200px; 
            background: radial-gradient(circle, rgba(0, 136, 204, 0.25) 0%, rgba(0, 136, 204, 0) 70%);
            border-radius: 50%; animation: pulseAura 2s infinite ease-in-out;
        }

        @keyframes pulseAura { 0% { transform: scale(0.85); opacity: 0.5; } 50% { transform: scale(1.25); opacity: 0.9; } 100% { transform: scale(0.85); opacity: 0.5; } }
        .loading-logo { max-width: 200px; height: auto; position: relative; z-index: 2; animation: floatLogo 2s infinite ease-in-out; }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        .loading-text { font-size: 16px; font-weight: 700; color: #333; text-align: center; max-width: 90%; animation: blinkText 2s infinite ease-in-out; }
        @keyframes blinkText { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .emoji-celebration-container {
            position: fixed; bottom: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 10000; overflow: hidden;
        }

        .floating-emoji {
            position: absolute; bottom: -50px; font-size: 32px; 
            user-select: none; animation: floatUp 2.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0.2; }
            20% { opacity: 1; transform: translateY(-20vh) scale(1.2) rotate(15deg); }
            80% { opacity: 0.9; }
            100% { transform: translateY(-100vh) scale(0.8) rotate(-25deg); opacity: 0; }
        }

        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease, padding 0.3s ease; position: relative; }
        .sidebar.collapsed { width: 45px; overflow: hidden; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: white; }
        .sidebar-logo-img { max-height: 60px; transition: 0.2s; }
        .sidebar.collapsed .sidebar-logo-img { display: none; }
        .btn-toggle-sidebar { background: #EAEAEA; border: 1px solid var(--border-color); border-radius: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: var(--text-muted); transition: 0.2s; }
        .btn-toggle-sidebar:hover { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }

        .filters-section { padding: 15px 20px; overflow-y: auto; flex-grow: 1; }
        .sidebar.collapsed .filters-section { display: none; }
        
        .filters-title { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .filters-title span.icon { background: #000; color: #fff; border-radius: 3px; padding: 0 4px; font-size: 10px; }
        
        details.filter-group { margin-bottom: 15px; }
        details.filter-group summary { font-size: 14px; font-weight: 600; color: var(--primary-blue); cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
        details.filter-group summary::-webkit-details-marker { display: none; }
        details.filter-group summary::before { content: '❯'; font-size: 10px; color: var(--text-main); transition: 0.2s; }
        details.filter-group[open] summary::before { transform: rotate(90deg); }
        
        .sidebar-checklist { padding: 10px 0 0 5px; display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto;}
        .sidebar-checklist label { font-size: 12px; color: var(--text-muted); display: flex; align-items: flex-start; gap: 6px; cursor: pointer; line-height: 1.2;}
        .sidebar-checklist input[type="checkbox"] { margin: 0; cursor: pointer; }
        .sidebar-search { width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; margin-top: 10px; outline: none;}

        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF;}
        
        .header { background: #FFFFFF; padding: 10px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 15px; box-shadow: 0px 1px 2px rgba(0,0,0,0.05); z-index: 10; flex-wrap: wrap; }
        
        .top-nav-tabs { display: flex; background: #EAEAEA; border-radius: 6px; padding: 3px; gap: 4px; }
        .top-nav-btn { border: none; background: transparent; padding: 6px 14px; border-radius: 4px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .top-nav-btn.active { background: var(--primary-blue); color: #FFFFFF; }

        .header-search-container { flex-grow: 1; max-width: 320px; position: relative; }
        .header-search-input { width: 100%; padding: 7px 12px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 13px; outline: none; background: #FAFAFA; }
        .header-search-input:focus { border-color: var(--primary-blue); background: #FFF; }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-pdf { background: #E74C3C; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-pdf:hover { background: #C0392B; }
        .btn-new { background: #32be3f; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.2s; white-space: nowrap; }
        .btn-new:hover:not(:disabled) { background: #29a034; }

        .kanban-wrapper { flex-grow: 1; padding: 20px; overflow-x: auto; background-color: #F9F9F9; }
        .kanban-board { display: flex; gap: 16px; height: 100%; min-width: max-content; }
        
        .kanban-column { background: transparent; width: 300px; display: flex; flex-direction: column; transition: 0.3s ease; }
        .kanban-column-header { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; }
